<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monaco 3D</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="tours.css">
  <style>
    :root { --panel: rgba(16, 20, 26, 0.82); --text: #eef1f4; --muted: #9aa5b1; --accent: #e8c27a; }
    html, body { margin: 0; height: 100%; background: #0b0e12; color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #globe { position: absolute; inset: 0; }
    .panel { position: absolute; left: 16px; top: 16px; max-width: 300px; padding: 14px 16px;
      background: var(--panel); border-radius: 10px; backdrop-filter: blur(6px); }
    .panel h1 { margin: 0 0 2px; font-size: 17px; letter-spacing: .02em; }
    .panel p { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
    .group { margin-top: 10px; }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; }
    button { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid rgba(255,255,255,.14);
      border-radius: 6px; padding: 6px 9px; font: inherit; font-size: 13px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.on { background: var(--accent); color: #111; border-color: var(--accent); }
    #legend { margin-top: 8px; font-size: 12px; color: var(--muted); display: none; }
    #legend span { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 4px 0 8px; }
    #legend span:first-child { margin-left: 0; }
    .nav { position: absolute; right: 16px; bottom: 40px; display: grid; gap: 6px;
      grid-template-columns: repeat(3, 40px); }
    .nav button { width: 40px; height: 40px; padding: 0; font-size: 18px; line-height: 1;
      background: var(--panel); border-color: rgba(255,255,255,.18); display: grid; place-items: center; }
    .nav .wide { grid-column: span 3; width: auto; font-size: 13px; }
    #compass svg { transition: transform .1s linear; }
    .hint { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
      background: var(--panel); color: var(--text); font-size: 12px; padding: 7px 12px; border-radius: 8px;
      max-width: calc(100% - 180px); text-align: center; transition: opacity .6s; }
    .hint.gone { opacity: 0; pointer-events: none; }
    @media (max-width: 600px) {
      .panel h1 { font-size: 15px; }
      .panel .label { display: none; }
      .group { margin-top: 6px; }
      #places { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
      #places button { flex: 0 0 auto; }
      .credit { font-size: 9px; left: 8px; right: 8px; max-width: none; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; }
      .nav { right: 8px; bottom: 34px; grid-template-columns: repeat(3, 44px); }
      .nav button { width: 44px; height: 44px; }
      .hint { left: 8px; transform: none; max-width: calc(100% - 170px); bottom: 36px; }
    }
    .credit { position: absolute; right: 12px; bottom: 6px; font-size: 11px; color: var(--muted);
      background: var(--panel); padding: 3px 8px; border-radius: 6px; max-width: calc(100% - 40px); }
    .credit a { color: var(--muted); }
    .cesium-viewer-bottom { display: none; }
    /* Google's attribution must stay visible while its tiles are shown. */
    body.photoreal .cesium-viewer-bottom { display: block; bottom: 30px; }
    @media (max-width: 600px) {
      .panel { left: 8px; right: 8px; top: 8px; max-width: none; padding: 10px 12px; }
      .panel p { display: none; }
    }
  </style>
</head>
<body>
  <div id="globe"></div>
  <div class="panel">
    <h1>Monaco 3D</h1>
    <p>Open IGN LiDAR data, accurate to the metre.</p>
    <div class="group">
      <div class="label">Go to</div>
      <div class="row" id="places"></div>
    </div>
    <div class="group" id="tours-group" hidden>
      <div class="label">Tours</div>
      <div class="row" id="tours"></div>
    </div>
    <div class="group">
      <div class="label">View</div>
      <div class="row">
        <button id="photoreal" hidden>Photoreal</button>
        <button data-mode="surface" class="on">Surface</button>
        <button data-mode="points">Points</button>
      </div>
    </div>
    <div class="group" id="colour-group" hidden>
      <div class="label">Colour</div>
      <div class="row">
        <button data-style="photo" class="on">Photo</button>
        <button data-style="class">Class</button>
        <button data-style="height">Height</button>
      </div>
      <div id="legend">
        <span style="background:#e9e3d6"></span>Buildings
        <span style="background:#5f9c4f"></span>Trees
        <span style="background:#b59f7e"></span>Ground
      </div>
    </div>
  </div>
  <div class="nav" aria-label="Camera controls">
    <button id="nav-tilt-up" title="Look more from above" aria-label="Tilt up">⤒</button>
    <button id="nav-zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="compass" title="Face north" aria-label="Face north"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 2 L15 12 L11 10 L7 12 Z" fill="#e8c27a"/><path d="M11 20 L7 12 L11 13.5 L15 12 Z" fill="#9aa5b1"/></svg></button>
    <button id="nav-left" title="Turn left" aria-label="Turn left">↺</button>
    <button id="nav-zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
    <button id="nav-right" title="Turn right" aria-label="Turn right">↻</button>
    <button id="nav-tilt-down" title="Look more towards the horizon" aria-label="Tilt down">⤓</button>
    <button id="nav-home" class="wide" style="grid-column: span 2" title="Back to the overview of Monaco">Reset view</button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="credit">
    LiDAR &amp; orthophoto © <a href="https://geoservices.ign.fr/lidarhd" target="_blank">IGN</a> (Etalab 2.0) ·
    Sentinel-2 cloudless © <a href="https://s2maps.eu" target="_blank">EOX</a> ·
    Terrain © <a href="https://github.com/tilezen/joerd/blob/master/docs/attribution.md" target="_blank">Mapzen/AWS</a> ·
    Circuit route © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> ·
    <a href="https://cesium.com/platform/cesiumjs/" target="_blank">CesiumJS</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
  <script src="config.js"></script>
  <script src="main.js"></script>
  <script src="tours.js"></script>
  <script src="lap-route.js"></script>
  <script src="lap.js"></script>
  <script src="rocher.js"></script>
</body>
</html>
